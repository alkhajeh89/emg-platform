# EMG™ Local Development Orchestration (FEAT-01-3)
#
# Brings up the datastores and identity provider named in Engineering
# Master Plan §4 (Technology Stack Selection) for local development, plus
# application services as they land in their owning sprint — each depending
# on these shared containers rather than duplicating them. `identity` was
# added in Sprint 2 (FEAT-02-1/FEAT-02-2); further services are added here
# as their sprint lands (EPIC-03 onward).
#
# Usage: make up / make down  (wraps `docker compose`)

name: emg-platform

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: emg-postgres
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: emg
      POSTGRES_PASSWORD: emg_local_dev_only
      POSTGRES_DB: emg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tools/seed-data/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emg -d emg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: emg-redis
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0@sha256:82c5b7a110456dbd42b86ea572e728878549954cc8bd03cd65410d75328095d2
    container_name: emg-keycloak
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: start-dev --import-realm --features=token-exchange,admin-fine-grained-authz
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_local_dev_only
    ports:
      - "8080:8080"
    volumes:
      - ./tools/seed-data/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Final correction-sprint Finding 6: Keycloak 25's fine-grained
  # token-exchange permission has no declarative realm-import syntax, so the
  # realm import above leaves emg-studio-bff unable to complete a real
  # exchange against Knowledge Graph's audience until this grant runs. This
  # one-shot container makes that automatic on every `docker compose up` —
  # a clean checkout now produces a working delegated identity path with no
  # manual step. Idempotent; see tools/scripts/provision-keycloak-realm.py.
  keycloak-provision:
    image: python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93
    container_name: emg-keycloak-provision
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./tools/scripts/provision-keycloak-realm.py:/provision-keycloak-realm.py:ro
    environment:
      EMG_KEYCLOAK_BASE_URL: http://keycloak:8080
      EMG_KEYCLOAK_REALM: emg
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_local_dev_only
      EMG_IDENTITY_KEYCLOAK_CLIENT_SECRET: emg_identity_local_dev_secret_do_not_use_in_prod
      EMG_IDENTITY_SERVICE_CLIENT_SECRET: emg_svc_identity_local_dev_secret_do_not_use_in_prod
    command: ["python", "/provision-keycloak-realm.py"]

  neo4j:
    image: neo4j:5-enterprise@sha256:93db923b3cb6d7b32b5477182f90b4438a832bb9f9082514c18957ff60bf1138
    container_name: emg-neo4j
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      NEO4J_AUTH: neo4j/emg_local_dev_only
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    container_name: emg-qdrant
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: emg-identity
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    environment:
      EMG_IDENTITY_DEPLOYMENT_ENVIRONMENT: development
      EMG_IDENTITY_KEYCLOAK_BASE_URL: http://keycloak:8080
      EMG_IDENTITY_KEYCLOAK_REALM: emg
      EMG_IDENTITY_KEYCLOAK_CLIENT_ID: emg-identity-service
      EMG_IDENTITY_KEYCLOAK_CLIENT_SECRET: emg_identity_local_dev_secret_do_not_use_in_prod
      # Local-dev-only signing key; production overrides via the centralized
      # secrets store (Engineering Master Plan §5), never via this file.
      EMG_IDENTITY_SESSION_SIGNING_KEY: emg_local_dev_session_signing_key_do_not_use_in_prod
      EMG_IDENTITY_REFRESH_TOKEN_STORE_BACKEND: postgres
      EMG_IDENTITY_REFRESH_TOKEN_POSTGRES_DSN: postgresql://emg_identity_app:emg_identity_local_dev_only_do_not_use_in_prod@postgres:5432/emg
    ports:
      - "8001:8000"

  identity-migrate:
    build:
      context: .
      dockerfile: services/audit-projector/Dockerfile
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    command: [python, -m, emg_persistence.provisioning, identity-migrate]
    environment:
      EMG_IDENTITY_MIGRATION_POSTGRES_DSN: postgresql://emg_identity_migrator:emg_identity_migrator_local_dev_only_do_not_use_in_prod@postgres:5432/emg

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    container_name: emg-audit
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      - postgres
      - keycloak
    environment:
      EMG_AUDIT_DEPLOYMENT_ENVIRONMENT: development
      EMG_AUDIT_STORE_BACKEND: postgres
      # Local-dev-only DSN using the INSERT/SELECT-only application role
      # created by tools/seed-data/postgres/001_audit_events.sql. Production
      # overrides via the centralized secrets store (Engineering Master Plan
      # §5), never via this file.
      EMG_AUDIT_POSTGRES_DSN: postgresql://emg_audit_app:emg_audit_local_dev_only_do_not_use_in_prod@postgres:5432/emg
      EMG_AUDIT_KEYCLOAK_BASE_URL: http://keycloak:8080
      EMG_AUDIT_KEYCLOAK_REALM: emg
    ports:
      - "8002:8000"

  knowledge-graph-migrate:
    build:
      context: .
      dockerfile: services/knowledge-graph/Dockerfile
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "emg_knowledge_graph_api.migrate"]
    environment:
      EMG_KNOWLEDGE_GRAPH_API_STORE_BACKEND: postgres
      EMG_KNOWLEDGE_GRAPH_API_MIGRATION_POSTGRES_DSN: postgresql://emg_knowledge_graph_migrator:emg_knowledge_graph_migrator_local_dev_only_do_not_use_in_prod@postgres:5432/emg

  knowledge-graph:
    build:
      context: .
      dockerfile: services/knowledge-graph/Dockerfile
    container_name: emg-knowledge-graph
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      knowledge-graph-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      EMG_KNOWLEDGE_GRAPH_API_DEPLOYMENT_ENVIRONMENT: development
      EMG_KNOWLEDGE_GRAPH_API_STORE_BACKEND: postgres
      # Local-dev-only DSN using the application role created by
      # tools/seed-data/postgres/005_knowledge_graph_role.sql. Production
      # overrides via the centralized secrets store (Engineering Master Plan
      # §5), never via this file.
      EMG_KNOWLEDGE_GRAPH_API_POSTGRES_DSN: postgresql://emg_knowledge_graph_app:emg_knowledge_graph_local_dev_only_do_not_use_in_prod@postgres:5432/emg
      EMG_KNOWLEDGE_GRAPH_API_NEO4J_URI: bolt://neo4j:7687
      EMG_KNOWLEDGE_GRAPH_API_NEO4J_USER: neo4j
      EMG_KNOWLEDGE_GRAPH_API_NEO4J_PASSWORD: emg_local_dev_only
      EMG_KNOWLEDGE_GRAPH_API_KEYCLOAK_BASE_URL: http://keycloak:8080
      EMG_KNOWLEDGE_GRAPH_API_KEYCLOAK_REALM: emg
      EMG_KNOWLEDGE_GRAPH_API_DELEGATED_CREDENTIAL_AUDIENCE: emg-knowledge-graph-audience
      EMG_KNOWLEDGE_GRAPH_API_AUDIT_PRODUCER_CLIENT_ID: emg-svc-knowledge-graph-writer
      EMG_KNOWLEDGE_GRAPH_API_AUDIT_PRODUCER_CLIENT_SECRET: emg_svc_knowledge_graph_writer_local_dev_secret_do_not_use_in_prod
      EMG_KNOWLEDGE_GRAPH_API_AUDIT_SERVICE_BASE_URL: http://audit:8000
    ports:
      - "8003:8000"

  studio-bff:
    build:
      context: .
      dockerfile: apps/studio-bff/Dockerfile
    container_name: emg-studio-bff
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      keycloak:
        condition: service_started
      keycloak-provision:
        condition: service_completed_successfully
      knowledge-graph:
        condition: service_started
    environment:
      EMG_STUDIO_BFF_DEPLOYMENT_ENVIRONMENT: development
      EMG_STUDIO_BFF_KEYCLOAK_BASE_URL: http://keycloak:8080
      EMG_STUDIO_BFF_KEYCLOAK_REALM: emg
      EMG_STUDIO_BFF_OIDC_CLIENT_ID: emg-studio-bff
      # Local-dev-only secret matching tools/seed-data/keycloak/emg-realm.json.
      # Production overrides via the centralized secrets store (Engineering
      # Master Plan §5), never via this file.
      EMG_STUDIO_BFF_OIDC_CLIENT_SECRET: emg_studio_bff_local_dev_secret_do_not_use_in_prod
      EMG_STUDIO_BFF_OIDC_REDIRECT_URI: http://localhost:8010/auth/callback
      EMG_STUDIO_BFF_STUDIO_FRONTEND_URL: http://localhost:3000
      # Localhost uses plain HTTP. Insecure __Host- cookies are rejected by
      # browsers, so local development opts into both policy and names.
      EMG_STUDIO_BFF_SECURE_COOKIES: "false"
      EMG_STUDIO_BFF_SESSION_COOKIE_NAME: emg_studio_session
      EMG_STUDIO_BFF_CSRF_COOKIE_NAME: emg_studio_csrf
      EMG_STUDIO_BFF_KNOWLEDGE_GRAPH_AUDIENCE: emg-knowledge-graph-audience
      EMG_STUDIO_BFF_KNOWLEDGE_GRAPH_BASE_URL: http://knowledge-graph:8000
      # No EMG_STUDIO_BFF_SESSION_BACKEND / REDIS_URL: this app never holds a
      # direct Redis (or any datastore) connection — correction-sprint
      # Finding 1, ADR-036 D-10.2. Session storage is in-process for this
      # batch; see docs/security/adr-038/07_PRODUCTION_CONFIGURATION.md.
    ports:
      - "8010:8000"

volumes:
  postgres-data:
  keycloak-data:
  neo4j-data:
  qdrant-data:
  neo4j-import:
