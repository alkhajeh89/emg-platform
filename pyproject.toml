[tool.ruff]
line-length = 100
target-version = "py310"
src = ["libs", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
namespace_packages = true
explicit_package_bases = true

mypy_path = [
    "libs/python",
    "services/audit/src",
    "services/identity/src"
]

exclude = [
    "libs/python/.*/tests/",
    "services/.*/tests/",
    "tools/"
]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "apps", "tests/infrastructure"]
python_files = "test_*.py"
# Each shared library package under /libs/python has its own tests/test_import.py
# with the same basename; importlib mode avoids sys.modules name collisions
# across packages without requiring globally-unique test filenames.
addopts = "--import-mode=importlib"
