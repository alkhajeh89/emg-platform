[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emg-auth-client"
version = "0.1.0"
description = "Auth client interface/conventions consumed by every service; implemented against Module 4/5 starting EPIC-02/03."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = ["emg-errors"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_auth_client"]

[tool.hatch.metadata]
allow-direct-references = true
