[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emg-auth-client"
version = "0.2.0"
description = "Auth client + Policy Enforcement Point interfaces consumed by every service; Module 4 implemented EPIC-02, Module 5 PEP contract added Sprint 4 (FEAT-03-1)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = ["emg-errors"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_auth_client"]

[tool.hatch.metadata]
allow-direct-references = true
