[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emg-api-contracts"
version = "0.1.0"
description = "REST/GraphQL response envelope, pagination, and error-shape conventions per the Enterprise API Architecture."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = ["emg-common-types"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_api_contracts"]

[tool.hatch.metadata]
allow-direct-references = true
