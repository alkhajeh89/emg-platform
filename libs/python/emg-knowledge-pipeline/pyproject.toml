[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emg-knowledge-pipeline"
version = "0.1.0"
description = "Storage-independent Knowledge Ingestion Pipeline (Module 7 — Knowledge Graph, EPIC-05, FEAT-05-2): converts validated ontology models into persistent graph operations via a GraphStore abstraction, with server-assigned owner/provenance/trust, deterministic idempotency, transactional rollback, and Module-6 audit-contract emission. Library-first; in-memory graph adapter, no Neo4j binding (that is FEAT-05-4). Added Sprint 10."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = ["emg-common-types", "emg-errors", "emg-ontology", "emg-audit-client", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_knowledge_pipeline"]

[tool.hatch.metadata]
allow-direct-references = true
