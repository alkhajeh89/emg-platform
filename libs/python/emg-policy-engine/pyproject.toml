[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emg-policy-engine"
version = "0.2.0"
description = "Local ABAC policy evaluation engine and default Policy Enforcement Point implementation (Module 5 — Authorization & Policy, FEAT-03-2), plus the RBAC baseline role catalog (FEAT-03-3) and authorization testing harness (FEAT-03-4). Sprints 4–5."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = ["emg-auth-client", "emg-errors", "pydantic>=2.8", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_policy_engine"]

[tool.hatch.metadata]
allow-direct-references = true
