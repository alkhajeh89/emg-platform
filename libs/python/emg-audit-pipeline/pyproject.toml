[build-system]
requires = ["hatchling>=1.14,<2"]
build-backend = "hatchling.build"

[project]
name = "emg-audit-pipeline"
version = "0.1.0"
description = "Audit pipeline core (Module 6 — Audit, Provenance & Digital Evidence, FEAT-04-1): canonical hashing, centralized hash chain + sequencing, append-only in-memory and PostgreSQL stores, integrity verification, idempotency. Added Sprint 6."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = ["emg-audit-client", "emg-common-types", "emg-errors", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.1"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_audit_pipeline"]

[tool.hatch.metadata]
allow-direct-references = true
