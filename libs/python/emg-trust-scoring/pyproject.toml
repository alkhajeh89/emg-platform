[build-system]
requires = ["hatchling>=1.14,<2"]
build-backend = "hatchling.build"

[project]
name = "emg-trust-scoring"
version = "0.1.0"
description = "Deterministic Knowledge Validation & Trust Scoring engine (Module 7 — Knowledge Graph, EPIC-05, FEAT-05-3): composite confidence scoring from observable signals (never a caller-supplied trust value), a versioned weighting policy with an explanation breakdown, and typed quality-gate validation. Library-first; pure/reproducible, no persistence, no service, no Neo4j. Added Sprint 11."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = ["emg-common-types", "emg-errors", "emg-ontology", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_trust_scoring"]

[tool.hatch.metadata]
allow-direct-references = true
