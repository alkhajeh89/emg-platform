[build-system]
requires = ["hatchling>=1.14,<2"]
build-backend = "hatchling.build"

[project]
name = "emg-studio-bff"
version = "0.1.0"
description = "EMG Studio Backend-for-Frontend — Phase 2B (ADR-035, ADR-036, ADR-038). The only trusted browser-application boundary: terminates OIDC Authorization Code + PKCE S256 for human sessions, holds a server-side session, and performs OAuth 2.0 Token Exchange (RFC 8693) to obtain audience-scoped Delegated Credentials for downstream Platform Services. Never a Policy Enforcement Point, never a datastore client."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "emg-common-types",
  "emg-errors",
  "emg-telemetry",
  "emg-api-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "mypy>=1.10",
  "ruff>=0.6",
]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_studio_bff"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
