name: CI

# Mirrors the local quality gates (make lint / make test / pre-commit) so a
# fresh clone and a PR are held to exactly the same bar as a developer's
# machine. Deliberately conservative: it installs the toolchain from
# requirements-dev.lock with hashes, uses the repo's own
# install/lint/test scripts, and pins the interpreter to the supported floor
# (3.10, per .python-version).

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & test (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install hash-locked toolchain
        run: |
          .venv/bin/python -m pip install --require-hashes -r requirements-production.lock
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock

      - name: Editable-install all local packages (libs, then services)
        run: |
          ./tools/scripts/install-libs.sh
          ./tools/scripts/install-services.sh

      - name: Install RC-1B recovery validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck postgresql

      - name: Environment diagnostic (informational, incl. editable-install integrity)
        run: ./tools/scripts/setup-check.sh || true

      - name: Lint (ruff + black --check)
        run: make lint

      - name: Test (pytest across libs + services + apps + infrastructure)
        run: make test

      - name: Validate production manifests render
        run: |
          kubectl kustomize infra/environments/production > /tmp/emg-production.yaml
          test -s /tmp/emg-production.yaml

      - name: Validate ADR-041 production provisioning contract
        run: .venv/bin/python tools/ci/validate_production_provisioning.py

      - name: Validate backup and recovery artifacts
        run: |
          bash -n tools/backup/*.sh
          shellcheck tools/backup/*.sh
          .venv/bin/python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('infra/backup').glob('*.json')]"
          .venv/bin/python -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('infra/backup').glob('*.yaml')]"
          .venv/bin/python tools/backup/backup_manifest.py validate infra/backup/sample-manifest.json
          .venv/bin/python tools/backup/backup_manifest.py schema-validate infra/backup/sample-manifest.json infra/backup/manifest.schema.json
          .venv/bin/pytest tests/infrastructure/test_backup_recovery.py -q

      - name: Real PostgreSQL backup, restore, WAL and PITR rehearsal
        env:
          EMG_RUN_POSTGRES_RECOVERY_TESTS: "1"
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          .venv/bin/pytest tests/infrastructure/test_backup_recovery_integration.py -q

      - name: Pre-commit hooks (all files)
        run: .venv/bin/pre-commit run --all-files

  typecheck:
    name: Type-check (mypy --strict, per package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install hash-locked toolchain
        run: |
          .venv/bin/python -m pip install --require-hashes -r requirements-production.lock
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock

      - name: Editable-install all local packages (libs, then services)
        run: |
          ./tools/scripts/install-libs.sh
          ./tools/scripts/install-services.sh

      - name: Type-check (make typecheck — TD-001, separate from lint)
        run: make typecheck


  studio:
    name: Studio (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install hash-locked Studio dependencies
        run: npm ci --workspace @emg/studio --include-workspace-root
      - name: Test Studio
        run: npm test --workspace @emg/studio
      - name: Type-check Studio
        run: npm run typecheck --workspace @emg/studio
      - name: Lint Studio
        run: npm run lint --workspace @emg/studio
      - name: Build production Studio
        env:
          STUDIO_BFF_INTERNAL_URL: http://emg-studio-bff:8000
        run: npm run build --workspace @emg/studio
      - name: Audit Studio production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-validation:
    name: Dependency Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install hash-locked validation dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Validate dependency manifest
        run: |
          python tools/ci/check_dependency_manifest.py

      - name: Check dependency drift
        run: |
          python tools/ci/check_dependency_drift.py

      - name: Unit test the implicit-dependency checker itself
        run: |
          pytest tools/ci/tests/ -v

      - name: Check implicit (undeclared) dependencies
        run: |
          python tools/ci/check_implicit_dependencies.py

  persistence:
    name: Persistence integration (PostgreSQL 16 + Neo4j 5)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: emg
          POSTGRES_PASSWORD: emg
          POSTGRES_DB: emg_persistence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community@sha256:362542416de6c09a971484d1893878016cc3b5cdec166e54b1c824a220ecd6b9
        env:
          NEO4J_AUTH: neo4j/emg-test-password
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
        ports:
          - 7687:7687
        # No container-level --health-cmd: cypher-shell's availability/auth
        # invocation in this image was not independently verified, so the
        # Python driver's verify_connectivity() step below is the sole,
        # authoritative readiness check instead.

    env:
      EMG_PERSISTENCE_TEST_POSTGRES_DSN: postgresql://emg:emg@localhost:5432/emg_persistence_test
      EMG_PERSISTENCE_TEST_NEO4J_URI: bolt://localhost:7687
      EMG_PERSISTENCE_TEST_NEO4J_USER: neo4j
      EMG_PERSISTENCE_TEST_NEO4J_PASSWORD: emg-test-password

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install hash-locked toolchain
        run: |
          .venv/bin/python -m pip install --require-hashes -r requirements-production.lock
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock

      - name: Editable-install all local packages (libs, then services)
        run: |
          ./tools/scripts/install-libs.sh
          ./tools/scripts/install-services.sh

      - name: Wait for PostgreSQL and Neo4j to become ready (60s deadline each)
        run: |
          echo "Waiting for PostgreSQL..."
          ready=0
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U emg >/dev/null 2>&1; then
              echo "PostgreSQL is ready."
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::PostgreSQL did not become ready within 60s"
            exit 1
          fi

          echo "Waiting for Neo4j..."
          ready=0
          for i in $(seq 1 30); do
            if .venv/bin/python -c "
          from neo4j import GraphDatabase
          driver = GraphDatabase.driver(
              'bolt://localhost:7687', auth=('neo4j', 'emg-test-password')
          )
          driver.verify_connectivity()
          driver.close()
          " >/dev/null 2>&1; then
              echo "Neo4j is ready."
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Neo4j did not become ready within 60s"
            exit 1
          fi

      - name: Persistence integration tests (real PostgreSQL + Neo4j)
        run: |
          .venv/bin/pytest libs/python/emg-persistence/tests/integration -v

      - name: Knowledge Graph atomic mutation integration tests (real PostgreSQL)
        run: |
          .venv/bin/pytest services/knowledge-graph/tests/integration/test_atomic_mutation_integration.py -v

      - name: Authoritative mutation-to-audit end-to-end proof (real PostgreSQL)
        run: |
          .venv/bin/pytest services/audit-projector/tests/integration/test_authoritative_audit_e2e.py -v

  security:
    name: Dependency, secret & SBOM security gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install hash-locked security tooling
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Audit production dependencies
        run: |
          mkdir -p artifacts
          pip-audit --require-hashes -r requirements-production.lock \
            --format json --output artifacts/pip-audit.json

      - name: Generate deterministic CycloneDX SBOM
        run: |
          python tools/ci/generate_sbom.py --version "${GITHUB_SHA}" \
            --output artifacts/emg-platform.cdx.json

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-artifacts
          path: artifacts/

  container-inventory:
    name: Governed runtime image inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install hash-locked inventory dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Derive governed image matrix
        id: inventory
        run: python tools/ci/runtime_image_release.py inventory --github-output >> "$GITHUB_OUTPUT"

  container-security:
    name: Container vulnerability gates
    needs: container-inventory
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-inventory.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build service image
        run: |
          docker build --pull=false \
            -f "${{ matrix.dockerfile }}" \
            -t emg-${{ matrix.service }}:${{ github.sha }} .

      - name: Smoke audit-projector runtime and provisioning entrypoints
        if: matrix.service == 'audit-projector'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tools/ci/smoke_audit_projector_image.py:/smoke.py:ro" \
            emg-audit-projector:${{ github.sha }} python /smoke.py

      - name: Scan image (critical vulnerabilities block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: emg-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload SARIF
        if: ${{ always() && vars.CODE_SCANNING_ENABLED == 'true' }}
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

      - name: Preserve scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif

  release-provenance:
    name: Release provenance
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build reproducible release artifacts
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=emg-platform/ \
            --output=dist/emg-platform-${GITHUB_REF_NAME}.tar.gz HEAD
          python tools/ci/generate_sbom.py --version "${GITHUB_SHA}" \
            --output dist/emg-platform.cdx.json
          python tools/ci/generate_provenance.py \
            --commit "${GITHUB_SHA}" --ref "${GITHUB_REF}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output dist/emg-platform.provenance.json \
            dist/emg-platform-${GITHUB_REF_NAME}.tar.gz dist/emg-platform.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emg-release-${{ github.ref_name }}
          path: dist/
