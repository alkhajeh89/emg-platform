name: Runtime image release

on:
  push:
    tags: ["v*"]

concurrency:
  group: runtime-image-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inventory:
    name: Derive governed runtime image inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install hash-locked inventory dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Derive canonical matrix
        id: inventory
        run: python tools/ci/runtime_image_release.py inventory --github-output >> "$GITHUB_OUTPUT"

  build-scan:
    name: Build and scan ${{ matrix.service }}
    needs: inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image once
        run: |
          mkdir -p "release-build/${{ matrix.service }}"
          docker build --pull=false \
            -f "${{ matrix.dockerfile }}" \
            -t "emg-release/${{ matrix.service }}:${GITHUB_SHA}" .

      - name: Smoke audit-projector runtime and provisioning entrypoints
        if: matrix.service == 'audit-projector'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tools/ci/smoke_audit_projector_image.py:/smoke.py:ro" \
            "emg-release/audit-projector:${GITHUB_SHA}" python /smoke.py

      - name: Mandatory Trivy security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: emg-release/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: release-build/${{ matrix.service }}/${{ matrix.service }}.trivy.sarif
          severity: CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate per-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: emg-release/${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx
          output: release-build/${{ matrix.service }}/${{ matrix.service }}.cdx.json
          exit-code: "0"

      - name: Preserve the scanned build output
        run: |
          docker save \
            --output "release-build/${{ matrix.service }}/${{ matrix.service }}.image.tar" \
            "emg-release/${{ matrix.service }}:${GITHUB_SHA}"

      - name: Upload scanned build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-image-build-${{ matrix.service }}
          path: release-build/${{ matrix.service }}/
          if-no-files-found: error

  publish-sign-attest:
    name: Publish, sign and attest ${{ matrix.service }}
    needs: [inventory, build-scan]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install hash-locked release dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Download the scanned build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-image-build-${{ matrix.service }}
          path: release-build/${{ matrix.service }}

      - name: Authenticate to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Publish the scanned image and capture its digest
        id: publish
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          OWNER="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPOSITORY="ghcr.io/${OWNER}/emg-platform/${SERVICE}"
          PUBLISHED_TAG="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
          docker load --input "release-build/${SERVICE}/${SERVICE}.image.tar"
          docker tag "emg-release/${SERVICE}:${GITHUB_SHA}" "$PUBLISHED_TAG"
          docker push "$PUBLISHED_TAG"
          DIGEST="$(docker buildx imagetools inspect "$PUBLISHED_TAG" | awk '$1 == "Digest:" {print $2; exit}')"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Registry did not return a canonical immutable digest"
            exit 1
          fi
          IMAGE_REFERENCE="${IMAGE_REPOSITORY}@${DIGEST}"
          echo "repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "reference=${IMAGE_REFERENCE}" >> "$GITHUB_OUTPUT"

      - name: Sign immutable digest with keyless OIDC
        env:
          IMAGE_REFERENCE: ${{ steps.publish.outputs.reference }}
        run: cosign sign --yes "$IMAGE_REFERENCE"

      - name: Verify the approved signing identity
        env:
          IMAGE_REFERENCE: ${{ steps.publish.outputs.reference }}
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/runtime-image-release.yml@${{ github.ref }}
        run: |
          cosign verify \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REFERENCE"

      - name: Attest runtime image provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record verified image evidence
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROVENANCE_REFERENCE: https://github.com/${{ github.repository }}/attestations
        run: |
          mkdir -p "release-record/${SERVICE}"
          cp "release-build/${SERVICE}/${SERVICE}.cdx.json" "release-record/${SERVICE}/"
          python tools/ci/runtime_image_release.py record \
            --service "$SERVICE" \
            --owner "$REPOSITORY_OWNER" \
            --digest "$DIGEST" \
            --commit "$GITHUB_SHA" \
            --repository "$SOURCE_REPOSITORY" \
            --workflow-identity ".github/workflows/runtime-image-release.yml@${GITHUB_REF}" \
            --workflow-run "$WORKFLOW_RUN" \
            --sbom "release-record/${SERVICE}/${SERVICE}.cdx.json" \
            --provenance-reference "$PROVENANCE_REFERENCE" \
            --output "release-record/${SERVICE}/${SERVICE}.image.json"

      - name: Upload verified image record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-image-record-${{ matrix.service }}
          path: release-record/${{ matrix.service }}/
          if-no-files-found: error

  finalize-release:
    name: Finalize deployable runtime release evidence
    needs: publish-sign-attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install hash-locked release dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Download all verified image records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runtime-image-record-*
          path: release-records
          merge-multiple: true

      - name: Render production source template
        run: kubectl kustomize infra/environments/production > production-template.yaml

      - name: Generate complete manifest, deployment bundle and rollback evidence
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-evidence/sboms release-evidence/rollback
          find release-records -name '*.cdx.json' -exec cp {} release-evidence/sboms/ \;
          python tools/ci/runtime_image_release.py finalize \
            --records release-records \
            --version "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --repository "$SOURCE_REPOSITORY" \
            --source-bundle production-template.yaml \
            --manifest-output release-evidence/release-images.json \
            --bundle-output release-evidence/production-resolved.yaml
          cp release-evidence/release-images.json \
            release-evidence/rollback/release-images.json

      - name: Upload retained runtime release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emg-runtime-release-${{ github.ref_name }}
          path: release-evidence/
          if-no-files-found: error
