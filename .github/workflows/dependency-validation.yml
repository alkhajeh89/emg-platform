name: Dependency Validation

on:
  pull_request:
    branches:
      - main
      - develop
      - phase2/sprint5-outbox-event-persistence

  push:
    branches:
      - main
      - develop
      - phase2/sprint5-outbox-event-persistence

jobs:
  dependency-check:
    name: Validate Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml tomli

      - name: Validate Dependency Manifest
        run: |
          python tools/ci/check_dependency_manifest.py

      - name: Check Dependency Drift
        run: |
          python tools/ci/check_dependency_drift.py
