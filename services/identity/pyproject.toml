[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emg-identity"
version = "0.1.0"
description = "EMG Identity Service — Module 4 (Identity & Authentication). Sprint 2: FEAT-02-1 (Identity Provider Integration) and FEAT-02-2 (Authentication Session Management)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "emg-common-types",
  "emg-errors",
  "emg-telemetry",
  "emg-auth-client",
  "emg-api-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_identity"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
