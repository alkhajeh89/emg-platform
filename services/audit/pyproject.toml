[build-system]
requires = ["hatchling>=1.14,<2"]
build-backend = "hatchling.build"

[project]
name = "emg-audit-service"
version = "0.1.0"
description = "EMG Audit Service — Module 6 (Audit, Provenance & Digital Evidence). Sprint 6 FEAT-04-1: a thin live service over emg-audit-client / emg-audit-pipeline owning the append-only store, ingestion, minimal US-04 query, and integrity verification."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.1",
  "emg-common-types",
  "emg-errors",
  "emg-telemetry",
  "emg-api-contracts",
  "emg-audit-client",
  "emg-audit-pipeline",
  "emg-auth-client",
  "emg-policy-engine",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.6",
]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_audit_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
