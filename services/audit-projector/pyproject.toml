[build-system]
requires = ["hatchling>=1.14,<2"]
build-backend = "hatchling.build"

[project]
name = "emg-audit-projector"
version = "0.1.0"
description = "ADR-028 tenant-partitioned mutation audit projector."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Proprietary"}
dependencies = [
  "httpx>=0.27",
  "pyjwt>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.1",
  "emg-audit-client",
  "emg-common-types",
  "emg-persistence",
  "emg-telemetry",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
emg-audit-projector = "emg_audit_projector.main:main"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/emg_audit_projector"]

[tool.hatch.metadata]
allow-direct-references = true
