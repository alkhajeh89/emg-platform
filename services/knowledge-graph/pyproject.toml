[build-system]
requires = ["hatchling>=1.14,<2"]
build-backend = "hatchling.build"

[project]
name = "emg-knowledge-graph-service"
version = "0.1.0"
description = "EMG Knowledge Graph Service — application/orchestration boundary over Module 7 graph-domain capabilities."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "emg-errors",
  "emg-ontology",
  "emg-platform-core",
  "emg-memory-graph",
  # Sprint 7.4: the emg_knowledge_graph_api HTTP layer. Declared as hard
  # dependencies (not an optional extra) to match emg_audit_service /
  # emg_identity exactly: tools/scripts/install-services.sh installs every
  # services/*/pyproject.toml unconditionally as `-e "${dir}[dev]"` and has
  # no notion of a service-specific extras group, so anything gated behind
  # an extra silently never gets installed by `make bootstrap`. An earlier
  # revision of this file used an `api` extra for this reason; it was
  # removed after review because it broke the documented bootstrap path.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.1",
  "emg-common-types",
  "emg-telemetry",
  "emg-api-contracts",
  "emg-persistence",
  # ADR-025 Group C2: authorization enforcement, reusing the platform's
  # existing PEP contract and ABAC evaluator (no new authorization
  # framework). Declared as hard dependencies for the same bootstrap reason
  # as the API dependencies above.
  "emg-auth-client",
  "emg-policy-engine",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.6",
]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
# Three packages from one service distribution: the application boundary,
# HTTP adapter, and ADR-030 composition/infrastructure adapter. Keeping the
# latter outside ``emg_knowledge_graph`` preserves application-to-persistence
# dependency inversion without creating a reverse dependency from the
# reusable persistence library back into this service.
packages = [
  "src/emg_knowledge_graph",
  "src/emg_knowledge_graph_api",
  "src/emg_knowledge_graph_infrastructure",
]

[tool.hatch.metadata]
allow-direct-references = true
