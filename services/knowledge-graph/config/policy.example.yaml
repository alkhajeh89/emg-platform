  # --- Relationship classification deny-overrides ---------------------

  - rule_id: kg-relationship-create-deny-unclassified-clearance
    resource_type: knowledge-graph.relationship
    action: create
    effect: deny
    required_attributes:
      classification_clearance: [UNCLASSIFIED]
    required_resource_attributes:
      classification: [INTERNAL, CONFIDENTIAL, SECRET]

  - rule_id: kg-relationship-create-deny-internal-clearance
