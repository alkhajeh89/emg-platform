apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emg-database-bootstrap-secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: emg-production-secrets}
  target: {name: emg-database-bootstrap-secrets, creationPolicy: Owner}
  data:
    - {secretKey: admin-postgres-dsn, remoteRef: {key: emg/production/database-bootstrap/admin-postgres-dsn}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emg-identity-secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: emg-production-secrets}
  target: {name: emg-identity-secrets, creationPolicy: Owner}
  data:
    - {secretKey: keycloak-client-secret, remoteRef: {key: emg/production/identity/keycloak-client-secret}}
    - {secretKey: service-client-secret, remoteRef: {key: emg/production/identity/service-client-secret}}
    - {secretKey: session-signing-key, remoteRef: {key: emg/production/identity/session-signing-key}}
    - {secretKey: refresh-postgres-dsn, remoteRef: {key: emg/production/identity/refresh-postgres-dsn}}
    - {secretKey: migration-postgres-dsn, remoteRef: {key: emg/production/identity/migration-postgres-dsn}}
---
# ADR-043 Amendment 1 A3.3: materializes the Approved Recovery Authority's
# current (generation, authority_revision) pair via the same governed
# ExternalSecret boundary as every other secret reference in this file --
# no new controller, provider, or platform component. This repository does
# not select the Approved Recovery Authority provider (A3); the remote key
# below only names where the environment's chosen, qualifying provider (see
# ADR-043 Amendment 1 A3's authority qualification gate) publishes the pair.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emg-identity-recovery-authority}
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: emg-production-secrets}
  target: {name: emg-identity-recovery-authority, creationPolicy: Owner}
  data:
    - {secretKey: recovery-authority.json, remoteRef: {key: emg/production/identity/recovery-authority-json}}
---
