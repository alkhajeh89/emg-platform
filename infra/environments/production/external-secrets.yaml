apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emg-database-bootstrap-secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: emg-production-secrets}
  target: {name: emg-database-bootstrap-secrets, creationPolicy: Owner}
  data:
    - {secretKey: admin-postgres-dsn, remoteRef: {key: emg/production/database-bootstrap/admin-postgres-dsn}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emg-identity-secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: emg-production-secrets}
  target: {name: emg-identity-secrets, creationPolicy: Owner}
  data:
    - {secretKey: keycloak-client-secret, remoteRef: {key: emg/production/identity/keycloak-client-secret}}
    - {secretKey: service-client-secret, remoteRef: {key: emg/production/identity/service-client-secret}}
    - {secretKey: session-signing-key, remoteRef: {key: emg/production/identity/session-signing-key}}
    - {secretKey: refresh-postgres-dsn, remoteRef: {key: emg/production/identity/refresh-postgres-dsn}}
---
