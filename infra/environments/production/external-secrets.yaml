---
# ADR-045 §4/§5, S6 TLS fix: the recovery-signer TLS server certificate
# and private key (infra/kubernetes/base/recovery-signer.yaml's tls
# volume). Populated by whatever certificate-issuance mechanism the
# signing-domain administrators select for the independently administered
# signing project (ADR-045 §4) -- this repository does not select or
# provision that mechanism, only the reference to its output, exactly as
# every other secret in this file.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emg-recovery-signer-tls}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: emg-production-secrets}
  target: {name: emg-recovery-signer-tls, creationPolicy: Owner}
  data:
    - {secretKey: tls.crt, remoteRef: {key: emg/production/recovery-signer/tls-crt}}
    - {secretKey: tls.key, remoteRef: {key: emg/production/recovery-signer/tls-key}}
