apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-default-deny}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: emg-platform}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-dns-egress}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: emg-platform}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-audit-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-audit}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-identity}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-knowledge-graph}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-audit-projector}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-knowledge-graph-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-knowledge-graph}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-studio-bff}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-internal-egress}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [emg-identity, emg-knowledge-graph, emg-studio-bff, emg-audit-projector]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-audit}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-knowledge-graph}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-studio-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-studio}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {networking.emg.io/ingress-access: "true"}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-studio-bff-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-studio-bff}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-studio}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-studio-to-bff-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-studio}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-studio-bff}}
      ports: [{protocol: TCP, port: 8000}]
---
# RC-C (EMG v1 RC closure, P0 alerting): every EMG workload now serves
# `/metrics` (see emg_telemetry.http_metrics for the four HTTP services and
# emg_audit_projector.metrics_server for the headless worker), but this
# default-deny model blocks it from anywhere until explicitly opened. This
# label is DISTINCT from `networking.emg.io/ingress-access` (product
# traffic): it is deliberately scoped to metrics-only ports, never the main
# application port's full API surface for services where they differ.
# Applying this label to the actual metrics-scraper's namespace is an
# operational step outside this repository's scope (no metrics backend is
# selected/deployed here -- see docs/release/EMG_V1_RELEASE_CANDIDATE_CLOSURE_REVIEW.md
# RC-P0-C and observability/README.md); until it is applied, this rule
# grants access to nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-observability-scrape-http}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [emg-identity, emg-audit, emg-knowledge-graph, emg-studio-bff]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {networking.emg.io/observability-access: "true"}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-observability-scrape-audit-projector}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-audit-projector}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {networking.emg.io/observability-access: "true"}
      ports: [{protocol: TCP, port: 9464}]
---
# ADR-045 §4/§5, S6 ATTACK_S: the signer RPC must never be reachable by
# any workload other than the authority/witness runtime. This is the
# primary, structurally-enforced exposure boundary (the Service itself is
# also ClusterIP-only with no Ingress resource); TLS is a separate,
# additive hardening layer, not a substitute for this restriction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-recovery-signer-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-recovery-signer}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-recovery-authority}}
      ports: [{protocol: TCP, port: 8443}]
---
# The authority/witness runtime's own egress is scoped to exactly the
# signer RPC port -- it has no need to reach any other in-cluster
# workload, and this rule does not grant it any.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: emg-recovery-authority-to-signer-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: emg-recovery-authority}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: emg-recovery-signer}}
      ports: [{protocol: TCP, port: 8443}]
