---
# ADR-044 §15, ADR-045 §4, S4 "recovery-authority-runtime" principal.
# iam.gke.io/gcp-service-account binds this Kubernetes ServiceAccount to a
# GCP service account via Workload Identity Federation -- the annotation
# value below is an illustrative placeholder (S4 manifest convention); an
# environment supplies the real, already-provisioned GCP service-account
# email via its own overlay, never a literal one committed here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emg-recovery-authority
  annotations: {iam.gke.io/gcp-service-account: "recovery-authority-runtime@example-authority-project.iam.gserviceaccount.com"}
automountServiceAccountToken: false
---
# ADR-045 §4/§5, S4 "recovery-signing" principal. Deliberately a DISTINCT
# ServiceAccount, bound (via Workload Identity Federation) to a GCP
# service account in the independently administered signing project --
# never the same GCP service account as emg-recovery-authority above.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emg-recovery-signer
  annotations: {iam.gke.io/gcp-service-account: "recovery-signer@example-signing-project.iam.gserviceaccount.com"}
automountServiceAccountToken: false
