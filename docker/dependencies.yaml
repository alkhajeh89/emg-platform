# EMG Dependency Manifest
# Source of truth for service dependencies

version: 1

services:

  studio:
    type: service
    path: apps/studio
    dockerfile: apps/studio/Dockerfile

    # Node dependencies are governed by package-lock.json. Studio imports no
    # internal Python distributions.
    dependencies: []

  identity:
    type: service
    path: services/identity
    dockerfile: services/identity/Dockerfile

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-telemetry
      - emg-auth-client
      - emg-api-contracts
      - emg-audit-client
      - emg-policy-engine


  audit:
    type: service
    path: services/audit
    dockerfile: services/audit/Dockerfile

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-telemetry
      - emg-api-contracts
      - emg-audit-client
      - emg-audit-pipeline
      - emg-auth-client
      - emg-policy-engine


  audit-projector:
    type: service
    path: services/audit-projector
    dockerfile: services/audit-projector/Dockerfile

    dependencies:
      - emg-audit-client
      - emg-common-types
      - emg-persistence
      - emg-telemetry


  studio-bff:
    type: service
    path: apps/studio-bff
    dockerfile: apps/studio-bff/Dockerfile

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-telemetry
      - emg-api-contracts


  keycloak-provisioner:
    type: deployment-tool
    path: tools
    dockerfile: tools/keycloak-provisioner.Dockerfile

    dependencies:
      - emg-common-types

  recovery-tool:
    type: deployment-tool
    path: tools
    dockerfile: tools/recovery.Dockerfile

    dependencies: []


  persistence:
    type: library
    path: libs/python/emg-persistence

    dependencies:
      - emg-errors
      - emg-memory-graph
      - emg-platform-core
      - neo4j
      - psycopg
      - psycopg-pool


  memory-graph:
    type: library
    path: libs/python/emg-memory-graph

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-knowledge-lifecycle
      - emg-knowledge-pipeline
      - emg-ontology
      - emg-semantic-layer
      - emg-trust-scoring


  knowledge-graph:
    type: service
    path: services/knowledge-graph
    dockerfile: services/knowledge-graph/Dockerfile

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-ontology
      - emg-platform-core
      - emg-memory-graph
      - emg-telemetry
      - emg-api-contracts
      - emg-persistence
      - emg-auth-client
      - emg-policy-engine
      - emg-audit-client


  recovery-authority:
    type: service
    path: services/recovery-authority
    dockerfile: services/recovery-authority/Dockerfile

    # Go module; governed by services/recovery-authority/go.mod and
    # go.sum, not by any internal Python distribution.
    dependencies: []

  recovery-signer:
    type: service
    path: services/recovery-authority/cmd/recovery-signer
    dockerfile: services/recovery-authority/recovery-signer.Dockerfile

    # Same Go module as recovery-authority (ADR-045 S5/S6): a separate,
    # independently deployed binary/image built from
    # services/recovery-authority/cmd/recovery-signer, registered under
    # its own service key/image (path deliberately distinct from
    # recovery-authority's above so tools/ci/check_dependency_manifest.py's
    # per-directory auto-discovery coverage check maps 1:1 to the one real
    # services/recovery-authority directory).
    dependencies: []


  entity-resolution:
    type: library
    path: libs/python/emg-entity-resolution

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-ontology
      - emg-semantic-layer
      - emg-memory-graph


  common-types:
    type: library
    path: libs/python/emg-common-types

    dependencies: []


  errors:
    type: library
    path: libs/python/emg-errors

    dependencies: []


  telemetry:
    type: library
    path: libs/python/emg-telemetry

    dependencies:
      - emg-common-types


  auth-client:
    type: library
    path: libs/python/emg-auth-client

    dependencies:
      - emg-errors


  api-contracts:
    type: library
    path: libs/python/emg-api-contracts

    dependencies:
      - emg-common-types


  audit-client:
    type: library
    path: libs/python/emg-audit-client

    dependencies:
      - emg-common-types
      - emg-errors


  audit-pipeline:
    type: library
    path: libs/python/emg-audit-pipeline

    dependencies:
      - emg-audit-client
      - emg-common-types
      - emg-errors


  policy-engine:
    type: library
    path: libs/python/emg-policy-engine

    dependencies:
      - emg-auth-client
      - emg-errors


  ontology:
    type: library
    path: libs/python/emg-ontology

    dependencies:
      - emg-common-types
      - emg-errors


  knowledge-lifecycle:
    type: library
    path: libs/python/emg-knowledge-lifecycle

    dependencies:
      - emg-common-types
      - emg-errors


  knowledge-pipeline:
    type: library
    path: libs/python/emg-knowledge-pipeline

    dependencies:
      - emg-audit-client
      - emg-common-types
      - emg-errors
      - emg-ontology


  trust-scoring:
    type: library
    path: libs/python/emg-trust-scoring

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-ontology


  semantic-layer:
    type: library
    path: libs/python/emg-semantic-layer

    dependencies:
      - emg-common-types
      - emg-errors


  connectors:
    type: library
    path: libs/python/emg-connectors

    dependencies:
      - emg-common-types
      - emg-errors


  platform-core:
    type: library
    path: libs/python/emg-platform-core

    dependencies:
      - emg-common-types
      - emg-errors
      - emg-memory-graph
